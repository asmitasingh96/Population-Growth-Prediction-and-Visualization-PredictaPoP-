<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | PredictaPop</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #2563eb, #06b6d4, #22c55e);
      background-size: 200% 200%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen font-sans">

<div class="w-full max-w-md bg-white p-10 rounded-3xl shadow-2xl">

  <h2 class="text-3xl font-semibold text-center mb-6 text-gray-800">
    Login to <span class="text-green-500">PredictaPop</span>
  </h2>

  {% if messages %}
    {% for message in messages %}
      <div class="text-red-500 bg-red-100 p-2 rounded mb-3 text-sm text-center">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username"
      class="w-full p-3 mb-4 border rounded-lg focus:ring-2 focus:ring-green-500" required>

    <input type="password" name="password" placeholder="Password"
      class="w-full p-3 mb-4 border rounded-lg focus:ring-2 focus:ring-green-500" required>

    <button type="submit"
      class="w-full bg-gradient-to-r from-blue-600 to-green-500 text-white py-3 rounded-lg font-semibold hover:scale-105 transition">
      Log In
    </button>
  </form>

  <a href="{% url 'register' %}" class="block text-center mt-4 text-blue-600">
    New here? Sign up
  </a>

</div>

</body>
</html>
