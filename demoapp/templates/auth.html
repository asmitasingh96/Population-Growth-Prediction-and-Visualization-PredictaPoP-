<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup | PredictaPop</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #2563eb, #06b6d4, #22c55e);
      background-size: 200% 200%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen font-sans">

  <div class="w-full max-w-md bg-white p-10 rounded-3xl shadow-2xl">

    <!-- Title -->
    <h2 class="text-3xl font-semibold text-center mb-6 text-gray-800">
      Predicta<span class="text-green-500">Pop</span>
    </h2>

    <!-- Toggle -->
    <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
      <button onclick="showLogin()" id="loginBtn"
        class="w-1/2 py-2 rounded-lg font-semibold bg-gradient-to-r from-blue-600 to-green-500 text-white">
        Login
      </button>
      <button onclick="showSignup()" id="signupBtn"
        class="w-1/2 py-2 rounded-lg font-semibold text-gray-600">
        Sign Up
      </button>
    </div>

    <!-- LOGIN -->
    <form method="POST" id="loginForm">
      {% csrf_token %}

      {% if messages %}
        {% for message in messages %}
          <div class="text-red-500 bg-red-100 p-2 rounded mb-3 text-sm text-center">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <input type="text" name="username" placeholder="Username"
        class="w-full p-3 mb-4 border rounded-lg outline-none focus:ring-2 focus:ring-green-500" required>

      <input type="password" name="password" placeholder="Password"
        class="w-full p-3 mb-4 border rounded-lg outline-none focus:ring-2 focus:ring-green-500" required>

      <button type="submit"
        class="w-full bg-gradient-to-r from-blue-600 to-green-500 text-white py-3 rounded-lg font-semibold hover:scale-105 transition">
        Log In
      </button>
    </form>

    <!-- SIGNUP -->
    <form method="POST" id="signupForm" class="hidden">
      {% csrf_token %}

      {% if messages %}
        <ul class="text-red-500 text-sm mb-3 text-center">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}

      <input type="text" name="username" placeholder="Username"
        class="w-full p-3 mb-3 border rounded-lg outline-none focus:ring-2 focus:ring-green-500" required>

      <input type="email" name="email" placeholder="Email"
        class="w-full p-3 mb-3 border rounded-lg outline-none focus:ring-2 focus:ring-green-500" required>

      <input type="password" name="password1" placeholder="Password"
        class="w-full p-3 mb-3 border rounded-lg outline-none focus:ring-2 focus:ring-green-500" required>

      <input type="password" name="password2" placeholder="Confirm Password"
        class="w-full p-3 mb-4 border rounded-lg outline-none focus:ring-2 focus:ring-green-500" required>

      <button type="submit"
        class="w-full bg-gradient-to-r from-green-500 to-blue-600 text-white py-3 rounded-lg font-semibold hover:scale-105 transition">
        Sign Up
      </button>
    </form>

  </div>

<script>
function showLogin() {
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("signupForm").classList.add("hidden");

  loginBtn.classList.add("bg-gradient-to-r","from-blue-600","to-green-500","text-white");
  signupBtn.classList.remove("bg-gradient-to-r","from-blue-600","to-green-500","text-white");
}

function showSignup() {
  document.getElementById("signupForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");

  signupBtn.classList.add("bg-gradient-to-r","from-blue-600","to-green-500","text-white");
  loginBtn.classList.remove("bg-gradient-to-r","from-blue-600","to-green-500","text-white");
}
</script>

</body>
</html>
