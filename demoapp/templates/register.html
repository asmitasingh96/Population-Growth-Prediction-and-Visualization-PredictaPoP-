<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | PredictaPop</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #22c55e, #06b6d4, #2563eb);
      background-size: 200% 200%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen font-sans">

<div class="w-full max-w-md bg-white p-10 rounded-3xl shadow-2xl">

  <h2 class="text-3xl font-semibold text-center mb-4">
    Create Account
  </h2>

  <p class="text-center text-gray-500 mb-4 text-sm">
    Predict population trends, literacy & more
  </p>

  {% if messages %}
    <ul class="text-red-500 text-sm mb-3 text-center">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username"
      class="w-full p-3 mb-3 border rounded-lg focus:ring-2 focus:ring-green-500" required>

    <input type="email" name="email" placeholder="Email"
      class="w-full p-3 mb-3 border rounded-lg focus:ring-2 focus:ring-green-500" required>

    <input type="password" name="password1" placeholder="Password"
      class="w-full p-3 mb-3 border rounded-lg focus:ring-2 focus:ring-green-500" required>

    <input type="password" name="password2" placeholder="Confirm Password"
      class="w-full p-3 mb-4 border rounded-lg focus:ring-2 focus:ring-green-500" required>

    <button type="submit"
      class="w-full bg-gradient-to-r from-green-500 to-blue-600 text-white py-3 rounded-lg font-semibold hover:scale-105 transition">
      Sign Up
    </button>
  </form>

  <a href="{% url 'login' %}" class="block text-center mt-4 text-blue-600">
    Already have an account? Login
  </a>

</div>

</body>
</html>
